<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background: linear-gradient(135deg, #090c10 0%, #111823 100%); font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Glowing effects -->
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="server-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192436" />
      <stop offset="100%" stop-color="#0f1722" />
    </linearGradient>
    <linearGradient id="client-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="p2p-pipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E8C5" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#14E8C5" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Outer ambient frame -->
  <rect x="20" y="20" width="960" height="600" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Title & Subtitle -->
  <text x="60" y="70" fill="#ffffff" font-size="24" font-weight="700" letter-spacing="0.5">VEIL DROP ARCHITECTURE &amp; DATA FLOW</text>
  <text x="60" y="95" fill="#8892b0" font-size="14" font-weight="400">Hybrid real-time signaling via WebSocket &amp; encrypted direct peer-to-peer transmission</text>

  <!-- ==================== SIGNALING SERVER (TOP) ==================== -->
  <g transform="translate(360, 130)">
    <rect x="0" y="0" width="280" height="110" rx="16" fill="url(#server-grad)" stroke="#14E8C5" stroke-width="2" filter="url(#glow-teal)" />
    <!-- Radar Icon -->
    <circle cx="45" cy="45" r="18" fill="rgba(20,232,197,0.15)" stroke="#14E8C5" stroke-width="2" />
    <circle cx="45" cy="45" r="8" fill="#14E8C5" />
    <path d="M 45 27 A 18 18 0 0 1 63 45" fill="none" stroke="#ffffff" stroke-width="2" />
    <!-- Text -->
    <text x="78" y="40" fill="#ffffff" font-size="16" font-weight="700">Signaling Server</text>
    <text x="78" y="60" fill="#14E8C5" font-size="12" font-weight="600">Node.js • Socket.IO (Port 5000)</text>
    <text x="30" y="90" fill="#94a3b8" font-size="12">Presence Registry &amp; SDP Relay (No File Storage)</text>
  </g>

  <!-- ==================== CLIENT PEER A (LEFT) ==================== -->
  <g transform="translate(80, 340)">
    <rect x="0" y="0" width="280" height="150" rx="16" fill="url(#client-grad)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <!-- Laptop Icon -->
    <rect x="30" y="30" width="40" height="26" rx="3" fill="none" stroke="#38bdf8" stroke-width="2" />
    <line x1="24" y1="56" x2="76" y2="56" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <!-- Text -->
    <text x="88" y="42" fill="#ffffff" font-size="18" font-weight="700">Peer A (Sender)</text>
    <text x="88" y="62" fill="#38bdf8" font-size="13" font-weight="600">React Client • Desktop-01</text>
    <!-- Features Box -->
    <rect x="20" y="85" width="240" height="48" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <text x="32" y="106" fill="#cbd5e1" font-size="12" font-weight="500">🔒 AES-GCM Encryption Shim</text>
    <text x="32" y="123" fill="#cbd5e1" font-size="12" font-weight="500">⚡ ArrayBuffer Chunk Generator</text>
  </g>

  <!-- ==================== CLIENT PEER B (RIGHT) ==================== -->
  <g transform="translate(640, 340)">
    <rect x="0" y="0" width="280" height="150" rx="16" fill="url(#client-grad)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <!-- Phone/Mac Icon -->
    <rect x="35" y="25" width="30" height="40" rx="5" fill="none" stroke="#a855f7" stroke-width="2" />
    <circle cx="50" cy="58" r="2" fill="#a855f7" />
    <!-- Text -->
    <text x="82" y="42" fill="#ffffff" font-size="18" font-weight="700">Peer B (Receiver)</text>
    <text x="82" y="62" fill="#a855f7" font-size="13" font-weight="600">React Client • MacBook-M3</text>
    <!-- Features Box -->
    <rect x="20" y="85" width="240" height="48" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <text x="32" y="106" fill="#cbd5e1" font-size="12" font-weight="500">🔑 Ephemeral PIN Authenticator</text>
    <text x="32" y="123" fill="#cbd5e1" font-size="12" font-weight="500">📦 Real-Time Blob Assembler</text>
  </g>

  <!-- ==================== STEP 1: SIGNALING ARROWS ==================== -->
  <!-- Left to Server -->
  <path d="M 220 340 Q 280 240 350 200" fill="none" stroke="#14E8C5" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-teal)" />
  <path d="M 350 180 Q 260 220 200 330" fill="none" stroke="#14E8C5" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" />
  
  <!-- Right to Server -->
  <path d="M 780 340 Q 720 240 650 200" fill="none" stroke="#14E8C5" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-teal)" />
  <path d="M 650 180 Q 740 220 800 330" fill="none" stroke="#14E8C5" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Step 1 Label Box -->
  <g transform="translate(340, 265)">
    <rect x="0" y="0" width="320" height="40" rx="20" fill="#0f172a" stroke="#14E8C5" stroke-width="1.5" />
    <text x="160" y="25" fill="#14E8C5" font-size="13" font-weight="700" text-anchor="middle">Step 1: WebSocket Discovery &amp; SDP Handshake</text>
  </g>

  <!-- ==================== STEP 2: P2P DIRECT TUNNEL ==================== -->
  <g transform="translate(370, 395)">
    <!-- Glowing direct data conduit -->
    <rect x="-5" y="15" width="270" height="20" rx="10" fill="url(#p2p-pipe)" filter="url(#glow-purple)" />
    <!-- Simulated flying packets -->
    <circle cx="40" cy="25" r="5" fill="#ffffff" />
    <circle cx="130" cy="25" r="6" fill="#ffffff" />
    <circle cx="220" cy="25" r="5" fill="#ffffff" />
  </g>

  <!-- Step 2 Label Box -->
  <g transform="translate(325, 450)">
    <rect x="0" y="0" width="350" height="45" rx="22.5" fill="#1e1b4b" stroke="#A855F7" stroke-width="2" filter="url(#glow-purple)" />
    <text x="175" y="21" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Step 2: Direct P2P WebRTC Data Channel</text>
    <text x="175" y="37" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle">⚡ Ultra-High Speed Streaming (0 Server Storage)</text>
  </g>

  <!-- ==================== STEP 3: SECURITY FOOTER BANNER ==================== -->
  <g transform="translate(150, 545)">
    <rect x="0" y="0" width="700" height="50" rx="12" fill="rgba(20,232,197,0.07)" stroke="#14E8C5" stroke-width="1" />
    <!-- Lock icon -->
    <path d="M 35 25 V 20 A 5 5 0 0 1 45 20 V 25" fill="none" stroke="#14E8C5" stroke-width="2" />
    <rect x="31" y="25" width="18" height="14" rx="3" fill="#14E8C5" />
    <text x="65" y="25" fill="#ffffff" font-size="14" font-weight="700">The "Veil" Privacy Protocol</text>
    <text x="65" y="42" fill="#94a3b8" font-size="12">All packets are sealed locally via AES-GCM and verified with an ephemeral 6-digit out-of-band PIN.</text>
  </g>

</svg>
